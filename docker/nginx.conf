server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    location /src/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
