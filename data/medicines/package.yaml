    category: "Обезболивающие и противовоспалительные"
    forms:
      - "капсулы мягкие 200 мг"
      - "таблетки покрытые оболочкой 200 мг"
    indications:
      - "головная боль"
      - "мигрень"
      - "зубная боль"
      - "ноющая челюсть"
      - "мышечные боли"
      - "боли в спине"
