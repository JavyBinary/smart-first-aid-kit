questions:
  - id: "q_01"
    text: "Сильно болит зуб и ноет челюсть, не могу уснуть"
    kind: "normal"
    relevant_documents:
      - "D01"
      - "D03"
      - "D04"
    reference_answer: "При острой зубной боли показан прием нестероидных противовоспалительных средств: Ибупрофен (Нурофен), Нимесил или комбинированный анальгетик Пенталгин."
    required_facts:
      - "ибупрофен"
      - "зубная боль"

  - id: "q_02"
    text: "Высокая температура под 39, жар и сильный озноб при гриппе"
    kind: "normal"
    relevant_documents:
      - "D01"
      - "D02"
      - "D05"
    reference_answer: "Для снижения высокой температуры и купирования лихорадки рекомендуются Парацетамол, Ибупрофен, а также комбинированные горячие напитки Терафлю."
    required_facts:
      - "парацетамол"
      - "температура"

  - id: "q_03"
    text: "Скрутило живот, сильный спазм и колики в брюшной полости"
    kind: "normal"
    relevant_documents:
      - "D03"
      - "D09"
      - "D22"
    reference_answer: "При спастических болях в животе показан прием спазмолитиков: Но-шпа (Дротаверин), Спазмалгон или Пенталгин."
    required_facts:
      - "дротаверин"
      - "спазм"

  - id: "q_04"
    text: "Острая водянистая диарея, расстройство желудка и жидкий стул"
    kind: "normal"
    relevant_documents:
      - "D11"
      - "D16"
      - "D18"
    reference_answer: "При диарее и жидком стуле показан прием энтеросорбентов Смекта или Полисорб для связывания токсинов, либо Лоперамид (Имодиум) при неинфекционном генезе."
    required_facts:
      - "диарея"
      - "смекта"

  - id: "q_05"
    text: "Сильная сезонная аллергия, зудят глаза, чихание и отек носа от пыльцы"
    kind: "normal"
    relevant_documents:
      - "D08"
      - "D13"
      - "D14"
    reference_answer: "При симптомах сезонного аллергического ринита и поллиноза применяют антигистаминные препараты Лоратадин, Супрастин, а также спрей Снуп для снятия отека."
    required_facts:
      - "лоратадин"
      - "аллергия"

  - id: "q_06"
    text: "Мучительная изжога и кислая отрыжка, жжение за грудиной"
    kind: "normal"
    relevant_documents:
      - "D11"
      - "D12"
      - "D17"
    reference_answer: "Для быстрого устранения изжоги применяют антацид Ренни, для обволакивания слизистой — Смекту, а для подавления секреции соляной кислоты — Омепразол."
    required_facts:
      - "изжога"
      - "ренни"

  - id: "q_07"
    text: "Порезал палец на кухне, ссадина и идет кровь, нужно обеззаразить"
    kind: "normal"
    relevant_documents:
      - "D23"
      - "D24"
      - "D25"
    reference_answer: "Для первичной дезинфекции и остановки капиллярного кровотечения используют раствор Перекиси водорода 3%, затем антисептик Хлоргексидин 0.05%, а для ускорения регенерации — мазь Бепантен."
    required_facts:
      - "хлоргексидин"
      - "раны"

  - id: "q_08"
    text: "Сильная боль в горле, першение, больно глотать при простуде"
    kind: "normal"
    relevant_documents:
      - "D05"
      - "D06"
      - "D07"
    reference_answer: "При боли и першении в горле рекомендуются антисептические рассасывающиеся леденцы Стрепсилс, а также противопростудные комплексы Терафлю или Колдрекс."
    required_facts:
      - "стрепсилс"
      - "горло"

  - id: "q_09"
    text: "Тяжесть в желудке и метеоризм после жирного переедания"
    kind: "normal"
    relevant_documents:
      - "D10"
      - "D11"
      - "D19"
    reference_answer: "При переедании и чувстве тяжести показан ферментный препарат Мезим Форте (Панкреатин), а при газообразовании и метеоризме — Активированный уголь или Смекта."
    required_facts:
      - "мезим"
      - "метеоризм"

  - id: "q_10"
    text: "Давящая боль в области сердца, приступ стенокардии, отдающий в лопатку"
    kind: "normal"
    relevant_documents:
      - "D26"
      - "D27"
      - "D28"
    reference_answer: "При острых давящих болях в сердце при стенокардии экстренно под язык применяется Нитроглицерин (при функциональных болях — Валидол или Корвалол). Если боль не проходит через 5 минут, срочно вызовите скорую помощь 112."
    required_facts:
      - "нитроглицерин"
      - "стенокардия"

