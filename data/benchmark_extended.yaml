questions:
  - id: "ext_01"
    text: "Очень сильно ломит виски, мигрень, какое НПВП подойдет"
    kind: "normal"
    relevant_documents:
      - "D01"
      - "D03"
      - "D04"
    reference_answer: "При головной боли и мигрени применяются НПВП Ибупрофен (Нурофен Экспресс), Пенталгин или Нимесил."
    required_facts:
      - "головная боль"

  - id: "ext_02"
    text: "ОРВИ, высокая температура и знобит, чем сбить жар"
    kind: "normal"
    relevant_documents:
      - "D01"
      - "D02"
      - "D05"
    reference_answer: "Для снижения температуры при ОРВИ используют Парацетамол, Ибупрофен или комбинированный Терафлю."
    required_facts:
      - "парацетамол"

  - id: "ext_03"
    text: "Мучает понос после несвежей еды и симптомы отравления"
    kind: "normal"
    relevant_documents:
      - "D11"
      - "D16"
      - "D18"
    reference_answer: "При диарее и пищевом отравлении применяют сорбенты Смекта, Полисорб или Лоперамид при неинфекционной диарее."
    required_facts:
      - "диарея"

  - id: "ext_04"
    text: "Тяжесть после жирной еды и кислая отрыжка, изжога жкт"
    kind: "normal"
    relevant_documents:
      - "D10"
      - "D12"
      - "D17"
    reference_answer: "При тяжести в желудке помогает Мезим Форте, а от изжоги применяются антацид Ренни и Омепразол."
    required_facts:
      - "изжога"

  - id: "ext_05"
    text: "Крапивница, сильный зуд на коже и высыпания от пыльцы"
    kind: "normal"
    relevant_documents:
      - "D13"
      - "D14"
      - "D15"
    reference_answer: "При крапивнице и аллергическом зуде применяются антигистаминные препараты Лоратадин, Супрастин или Зодак."
    required_facts:
      - "крапивница"

  - id: "ext_06"
    text: "Скрутило живот, сильный спазм, поможет ли Но-шпа"
    kind: "normal"
    relevant_documents:
      - "D03"
      - "D09"
      - "D22"
    reference_answer: "При спазмах гладкой мускулатуры применяются спазмолитики Но-шпа (Дротаверин), Спазмалгон и Пенталгин."
    required_facts:
      - "дротаверин"

  - id: "ext_07"
    text: "Можно ли выпить Ибупрафен при зубной боли (опечатка в названии)"
    kind: "normal"
    relevant_documents:
      - "D01"
      - "D03"
      - "D04"
    reference_answer: "При зубной боли показан Ибупрофен (Нурофен Экспресс 200 мг)."
    required_facts:
      - "ибупрофен"

  - id: "ext_08"
    text: "Попала соринка в глаз, веки покраснели и гноится конъюнктива"
    kind: "normal"
    relevant_documents:
      - "D29"
    reference_answer: "При бактериальном конъюнктивите, блефарите и профилактике воспалений при попадании инородных тел в глаз применяются капли Сульфацил натрия (Альбуцид 20%)."
    required_facts:
      - "сульфацетамид"

  - id: "ext_09"
    text: "Гнойная бактериальная ангина и острый тонзиллит, какой антибиотик указан в аптечке"
    kind: "normal"
    relevant_documents:
      - "D30"
    reference_answer: "При бактериальной ангине и остром тонзиллите по назначению врача применяется антибактериальный препарат пенициллинового ряда Амоксициллин."
    required_facts:
      - "амоксициллин"

  - id: "ext_10"
    text: "Обгорел на солнце, покраснела кожа, чем помазать от солнечного ожога"
    kind: "normal"
    relevant_documents:
      - "D23"
    reference_answer: "При термических и солнечных ожогах 1-2 степени для регенерации кожи применяется мазь или крем Бепантен (Декспантенол 5%)."
    required_facts:
      - "декспантенол"

  - id: "ext_11"
    text: "Болезненные месячные, тянет низ живота, какое средство принять при альгодисменорее"
    kind: "normal"
    relevant_documents:
      - "D01"
      - "D03"
      - "D04"
      - "D09"
      - "D22"
    reference_answer: "При альгодисменорее и болезненных менструациях применяются НПВП (Ибупрофен, Нимесулид) или спазмолитики (Дротаверин, Спазмалгон)."
    required_facts:
      - "альгодисменорея"

  - id: "ext_12"
    text: "Укачивает в самолете, тошнит в морской поездке, что рассосать под язык"
    kind: "normal"
    relevant_documents:
      - "D27"
    reference_answer: "При синдроме укачивания (морской и воздушной болезни) используют подъязычные таблетки Валидол."
    required_facts:
      - "валидол"

  - id: "ext_13"
    text: "Сильно заложило нос при синусите, трудно дышать, нужно снять отек"
    kind: "normal"
    relevant_documents:
      - "D05"
      - "D06"
      - "D08"
    reference_answer: "Для снятия заложенности носа и отека слизистой при синусите применяют назальный спрей Снуп (Ксилометазолин) или комбинированные средства Терафлю, Колдрекс."
    required_facts:
      - "ксилометазолин"

  - id: "ext_14"
    text: "Постоянная бессонница на нервной почве и учащенное сердцебиение"
    kind: "normal"
    relevant_documents:
      - "D28"
    reference_answer: "При нарушениях засыпания, бессоннице, повышенной раздражительности и синусовой тахикардии применяют капли Корвалол."
    required_facts:
      - "корвалол"

  - id: "ext_15"
    text: "Диарея путешественников в отпуске без температуры и крови в стуле"
    kind: "normal"
    relevant_documents:
      - "D11"
      - "D18"
    reference_answer: "При диарее путешественников без признаков дизентерии применяют Лоперамид (Имодиум) или энтеросорбент Смекта."
    required_facts:
      - "лоперамид"

  - id: "ext_16"
    text: "Сильная острая боль после перелома и вывиха, какое мощное обезболивающее есть"
    kind: "normal"
    relevant_documents:
      - "D21"
    reference_answer: "При сильном болевом синдроме травматического генеза, переломах и вывихах применяется Кетанов (Кеторолак 10 мг) коротким курсом до 5 дней."
    required_facts:
      - "кеторолак"

  - id: "ext_17"
    text: "Вздутие живота и газы после обильного ужина, брожение в кишечнике"
    kind: "normal"
    relevant_documents:
      - "D10"
      - "D11"
      - "D19"
    reference_answer: "При метеоризме, диспепсии и брожении в кишечнике применяют Активированный уголь, Мезим Форте или Смекту."
    required_facts:
      - "метеоризм"

  - id: "ext_18"
    text: "Эрозии желудка, нужно защитить ЖКТ при длительном приеме НПВП"
    kind: "normal"
    relevant_documents:
      - "D17"
    reference_answer: "Для профилактики эрозивно-язвенных поражений ЖКТ при приеме НПВП применяется ингибитор протонной помпы Омепразол."
    required_facts:
      - "омепразол"

  - id: "ext_19"
    text: "Укус насекомого, сильный отек и аллергическая реакция, что выпить"
    kind: "normal"
    relevant_documents:
      - "D13"
      - "D14"
      - "D15"
    reference_answer: "При острых аллергических реакциях на укусы насекомых и отеке применяется Супрастин (Хлоропирамин) или другие антигистаминные средства."
    required_facts:
      - "хлоропирамин"

  - id: "ext_20"
    text: "Постоянно садится голос, ларингит и осиплость, какие таблетки для рассасывания"
    kind: "normal"
    relevant_documents:
      - "D07"
    reference_answer: "При ларингите, фарингите и осиплости голоса применяются таблетки для рассасывания Стрепсилс."
    required_facts:
      - "ларингит"

