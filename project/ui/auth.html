<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedAI — Вход</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --green: #019F74;
    --green-dark: #017a5a;
    --green-light: #e6f7f2;
    --bg-pattern: #f7f9fa;
    --card: #ffffff;
    --text: #1a1a1a;
    --text-muted: #7a7f85;
    --border: #e5e7eb;
    --danger: #e5484d;
  }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    overflow: hidden;
  }

  body {
    background-color: var(--bg-pattern);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240' viewBox='0 0 240 240'><g fill='none' opacity='0.9'><g transform='translate(60 60) rotate(-30)'><rect x='-28' y='-11' width='56' height='22' rx='11' stroke='%23ccd2d0' stroke-width='1.6'/><line x1='0' y1='-11' x2='0' y2='11' stroke='%23ccd2d0' stroke-width='1.6'/></g><g transform='translate(180 60) rotate(30)'><rect x='-28' y='-11' width='56' height='22' rx='11' stroke='%23ccd2d0' stroke-width='1.6'/><line x1='0' y1='-11' x2='0' y2='11' stroke='%23ccd2d0' stroke-width='1.6'/></g><g transform='translate(60 180) rotate(-30)'><rect x='-28' y='-11' width='56' height='22' rx='11' stroke='%23ccd2d0' stroke-width='1.6'/><line x1='0' y1='-11' x2='0' y2='11' stroke='%23ccd2d0' stroke-width='1.6'/></g><g transform='translate(180 180) rotate(30)'><rect x='-28' y='-11' width='56' height='22' rx='11' stroke='%23ccd2d0' stroke-width='1.6'/><line x1='0' y1='-11' x2='0' y2='11' stroke='%23ccd2d0' stroke-width='1.6'/></g><g transform='translate(120 120) rotate(-55)'><rect x='-24' y='-10' width='48' height='20' rx='10' stroke='%23ccd2d0' stroke-width='1.6'/><line x1='0' y1='-10' x2='0' y2='10' stroke='%23ccd2d0' stroke-width='1.6'/></g></g></svg>");
    background-size: 240px 240px;
    background-repeat: repeat;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .auth-card {
    width: 100%;
    max-width: 440px;
    background: #ffffff;
    border-radius: 26px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.08), 0 2px 8px rgba(0,0,0,0.03);
    padding: 36px 36px 32px;
    border: 1px solid rgba(0,0,0,0.03);
    animation: cardIn 0.45s cubic-bezier(0.4, 0, 0.2, 1);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(14px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ===== Логотип ===== */
  .auth-logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 26px;
  }
  .logo-icon {
    width: 62px; height: 62px;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--green), #02c494);
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    box-shadow: 0 10px 24px rgba(1,159,116,0.35);
    margin-bottom: 14px;
  }
  .logo-icon svg { width: 34px; height: 34px; }
  .auth-logo h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  .auth-logo p {
    font-size: 13.5px;
    color: var(--text-muted);
    margin-top: 4px;
    text-align: center;
  }

  /* ===== Табы ===== */
  .tabs {
    display: flex;
    background: #f1f3f4;
    border-radius: 14px;
    padding: 4px;
    margin-bottom: 24px;
    position: relative;
  }
  .tab {
    flex: 1;
    position: relative;
    z-index: 2;
    background: transparent;
    border: none;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    border-radius: 10px;
    transition: color 0.25s ease;
  }
  .tab.active { color: #fff; }
  .tab-indicator {
    position: absolute;
    top: 4px;
    left: 4px;
    width: calc(50% - 4px);
    height: calc(100% - 8px);
    background: var(--green);
    border-radius: 10px;
    box-shadow: 0 4px 12px rgba(1,159,116,0.3);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 1;
  }
  .tabs.register .tab-indicator { transform: translateX(100%); }

  /* ===== Форма ===== */
  .form { display: flex; flex-direction: column; gap: 14px; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-muted);
  }

  .input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .input-icon {
    position: absolute;
    left: 14px;
    width: 18px; height: 18px;
    color: #b8bdc2;
    pointer-events: none;
    transition: color 0.2s ease;
  }
  .field input {
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px 12px 42px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    background: #fff;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .field input::placeholder { color: #b8bdc2; }
  .field input:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(1,159,116,0.12);
  }
  .input-wrap:focus-within .input-icon { color: var(--green); }

  /* Кнопка-глаз */
  .toggle-pass {
    position: absolute;
    right: 10px;
    width: 32px; height: 32px;
    background: transparent;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: #b8bdc2;
    transition: background 0.2s, color 0.2s;
  }
  .toggle-pass:hover { background: #f1f3f4; color: var(--text); }
  .toggle-pass svg { width: 18px; height: 18px; }

  /* ===== Основная кнопка ===== */
  .btn-primary {
    width: 100%;
    background: var(--green);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 13px 16px;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
    display: flex; align-items: center; justify-content: center;
    gap: 8px;
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 6px 18px rgba(1,159,116,0.3);
  }
  .btn-primary:hover { background: var(--green-dark); box-shadow: 0 8px 22px rgba(1,159,116,0.4); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled {
    background: #b8bdc2;
    box-shadow: none;
    cursor: not-allowed;
    transform: none;
  }
  .btn-primary .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== Скрытие блоков ===== */
  .form-register { display: none; }
  .form-login { display: flex; }
  .tabs.register ~ .form-login { display: none; }
  .tabs.register ~ .form-register { display: flex; }

  /* ===== Ошибки ===== */
  .field.error input {
    border-color: var(--danger);
    box-shadow: 0 0 0 3px rgba(229,72,77,0.12);
  }
  .error-msg {
    font-size: 12px;
    color: var(--danger);
    margin-top: -2px;
    display: none;
  }
  .field.error .error-msg { display: block; }

  /* ===== Мобильные ===== */
  @media (max-width: 480px) {
    .auth-card { padding: 28px 22px 24px; border-radius: 20px; }
    .auth-logo h1 { font-size: 20px; }
    .logo-icon { width: 56px; height: 56px; }
    .logo-icon svg { width: 30px; height: 30px; }
  }
</style>
</head>
<body>

<div class="auth-card">
  <!-- Логотип -->
  <div class="auth-logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="7" width="20" height="14" rx="2.5"/>
        <path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        <path d="M12 11.5v5M9.5 14h5"/>
      </svg>
    </div>
    <h1>MedAI</h1>
    <p>Умная домашняя аптечка</p>
  </div>

  <!-- Табы -->
  <div class="tabs" id="tabs">
    <div class="tab-indicator"></div>
    <button class="tab active" data-tab="login">Вход</button>
    <button class="tab" data-tab="register">Регистрация</button>
  </div>

  <!-- ===== Форма входа ===== -->
  <form class="form form-login" id="loginForm" novalidate>
    <div class="field" id="loginEmailField">
      <label for="loginEmail">Email</label>
      <div class="input-wrap">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="2"/>
          <path d="M3 7l9 6 9-6"/>
        </svg>
        <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="error-msg">Введите корректный email</div>
    </div>

    <div class="field" id="loginPassField">
      <label for="loginPassword">Пароль</label>
      <div class="input-wrap">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="11" width="16" height="10" rx="2"/>
          <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
        </svg>
        <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
        <button type="button" class="toggle-pass" data-target="loginPassword" aria-label="Показать пароль">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <div class="error-msg">Пароль должен быть не короче 6 символов</div>
    </div>

    <button type="submit" class="btn-primary" id="loginBtn">
      <span>Войти</span>
    </button>
  </form>

  <!-- ===== Форма регистрации ===== -->
  <form class="form form-register" id="registerForm" novalidate>
    <div class="field" id="regNameField">
      <label for="regName">Имя</label>
      <div class="input-wrap">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 21c0-4 4-7 8-7s8 3 8 7"/>
        </svg>
        <input type="text" id="regName" placeholder="Как к вам обращаться" autocomplete="name">
      </div>
      <div class="error-msg">Введите имя (минимум 2 символа)</div>
    </div>

    <div class="field" id="regEmailField">
      <label for="regEmail">Email</label>
      <div class="input-wrap">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="2"/>
          <path d="M3 7l9 6 9-6"/>
        </svg>
        <input type="email" id="regEmail" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="error-msg">Введите корректный email</div>
    </div>

    <div class="field" id="regPassField">
      <label for="regPassword">Пароль</label>
      <div class="input-wrap">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="11" width="16" height="10" rx="2"/>
          <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
        </svg>
        <input type="password" id="regPassword" placeholder="Минимум 6 символов" autocomplete="new-password">
        <button type="button" class="toggle-pass" data-target="regPassword" aria-label="Показать пароль">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <div class="error-msg">Пароль должен быть не короче 6 символов</div>
    </div>

    <div class="field" id="regConfirmField">
      <label for="regConfirm">Повторите пароль</label>
      <div class="input-wrap">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="11" width="16" height="10" rx="2"/>
          <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
        </svg>
        <input type="password" id="regConfirm" placeholder="••••••••" autocomplete="new-password">
        <button type="button" class="toggle-pass" data-target="regConfirm" aria-label="Показать пароль">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <div class="error-msg">Пароли не совпадают</div>
    </div>

    <button type="submit" class="btn-primary" id="registerBtn">
      <span>Создать аккаунт</span>
    </button>
  </form>
</div>

<script>
  // ===== Переключение табов =====
  const tabs = document.getElementById('tabs');
  const tabButtons = tabs.querySelectorAll('.tab');
  const loginForm = document.getElementById('loginForm');
  const registerForm = document.getElementById('registerForm');

  tabButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      const target = btn.dataset.tab;
      tabButtons.forEach(b => b.classList.toggle('active', b === btn));
      tabs.classList.toggle('register', target === 'register');

      if (target === 'login') {
        loginForm.style.display = 'flex';
        registerForm.style.display = 'none';
      } else {
        loginForm.style.display = 'none';
        registerForm.style.display = 'flex';
      }
    });
  });

  // ===== Показать/скрыть пароль =====
  document.querySelectorAll('.toggle-pass').forEach(btn => {
    btn.addEventListener('click', () => {
      const targetId = btn.dataset.target;
      const field = document.getElementById(targetId);
      const isPassword = field.type === 'password';
      field.type = isPassword ? 'text' : 'password';

      btn.innerHTML = isPassword
        ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
             <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
             <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
             <path d="M1 1l22 22"/>
           </svg>`
        : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
             <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
             <circle cx="12" cy="12" r="3"/>
           </svg>`;
    });
  });

  // ===== Валидация =====
  const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  function setError(fieldId, hasError) {
    document.getElementById(fieldId).classList.toggle('error', hasError);
    return !hasError;
  }

  function clearErrors(form) {
    form.querySelectorAll('.field').forEach(f => f.classList.remove('error'));
  }

  // ===== Кнопка с загрузкой =====
  function setLoading(btn, loading) {
    if (loading) {
      btn.disabled = true;
      btn.dataset.originalText = btn.innerHTML;
      btn.innerHTML = `<span class="spinner"></span><span>Подождите…</span>`;
    } else {
      btn.disabled = false;
      btn.innerHTML = btn.dataset.originalText;
    }
  }

  // ===== Базовый URL API =====
  const API_BASE = 'http://localhost:8000/api/v1';

  // ===== Вход =====
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearErrors(loginForm);

    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;

    let ok = true;
    ok = setError('loginEmailField', !emailRe.test(email)) && ok;
    ok = setError('loginPassField', password.length < 6) && ok;

    if (!ok) return;

    const btn = document.getElementById('loginBtn');
    setLoading(btn, true);

    try {
      const res = await fetch(`${API_BASE}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      if (res.ok) {
        const data = await res.json();
        localStorage.setItem('medai_token', data.token || '');
        localStorage.setItem('medai_user', data.user.email);
        localStorage.setItem('medai_name', data.user.name || '');
        localStorage.setItem('medai_role', data.user.role || 'user');
        setLoading(btn, false);
        window.location.href = data.user.role === 'admin' ? 'admin.html' : 'site.html';
        return;
      }
    } catch (err) {
      // Бэкенд не запущен — штатный режим демонстрации прототипа (КТ1)
    }

    setTimeout(() => {
      const isAdmin = email.trim().toLowerCase() === 'admin@medai.ru';
      localStorage.setItem('medai_user', email);
      localStorage.setItem('medai_role', isAdmin ? 'admin' : 'user');
      if (!localStorage.getItem('medai_name')) {
        localStorage.setItem('medai_name', email.split('@')[0]);
      }
      setLoading(btn, false);
      window.location.href = isAdmin ? 'admin.html' : 'site.html';
    }, 600);
  });

  // ===== Регистрация =====
  registerForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearErrors(registerForm);

    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    const confirm = document.getElementById('regConfirm').value;

    let ok = true;
    ok = setError('regNameField', name.length < 2) && ok;
    ok = setError('regEmailField', !emailRe.test(email)) && ok;
    ok = setError('regPassField', password.length < 6) && ok;
    ok = setError('regConfirmField', password !== confirm || confirm.length < 6) && ok;

    if (!ok) return;

    const btn = document.getElementById('registerBtn');
    setLoading(btn, true);

    try {
      const res = await fetch(`${API_BASE}/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password })
      });
      if (res.ok) {
        const data = await res.json();
        localStorage.setItem('medai_token', data.token || '');
        localStorage.setItem('medai_user', data.user.email);
        localStorage.setItem('medai_name', data.user.name || name);
        localStorage.setItem('medai_role', 'user');
        setLoading(btn, false);
        window.location.href = 'site.html';
        return;
      }
    } catch (err) {
      // Бэкенд не запущен — штатный режим демонстрации прототипа (КТ1)
    }

    setTimeout(() => {
      localStorage.setItem('medai_user', email);
      localStorage.setItem('medai_name', name);
      localStorage.setItem('medai_role', 'user');
      setLoading(btn, false);
      window.location.href = 'site.html';
    }, 600);
  });
</script>
</body>
</html>
