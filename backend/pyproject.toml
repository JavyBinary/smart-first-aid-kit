[build-system]
requires = ["hatchling>=1.25.0,<2"]
build-backend = "hatchling.build"

[project]
name = "medai"
version = "0.1.0"
description = "Backend for MedAI Smart First Aid Kit research project (BMSTU NIRS)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13.0,<2",
    "argon2-cffi>=23.1.0,<24",
    "asyncpg>=0.29.0,<1",
    "fastapi>=0.115.0,<1",
    "litellm>=1.40.0,<2",
    "pydantic>=2.8.0,<3",
    "pyjwt>=2.8.0,<3",
    "pymorphy3>=2.0.0,<3",
    "pymorphy3-dicts-ru>=2.4.417127.4801398",
    "pyyaml>=6.0.1,<7",
    "redis>=5.0.0,<6",
    "sqlalchemy[asyncio]>=2.0.30,<3",
    "uvicorn>=0.30.0,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0,<1",
    "pytest>=8.2.0,<9",
    "pytest-asyncio>=0.23.0,<1",
    "ruff>=0.5.0,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/medai"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
